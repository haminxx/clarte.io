name: Build Clarte iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Log iOS project structure
        run: |
          echo "iOS app source files are in apps/ios/Clarte/"
          ls -la apps/ios/Clarte/
          echo "Create an Xcode project and add these files. See apps/ios/README.md"

      - name: Note
        run: |
          echo "iOS builds require an Xcode project. Create one in Xcode (File > New > Project > iOS App),"
          echo "then add the Swift files from apps/ios/Clarte/. For CI builds with code signing,"
          echo "add APPLE_CERTIFICATE and APPLE_PROVISIONING_PROFILE secrets."
