name: Build Clarte Desktop

on:
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npm run tauri build
        env:
          VITE_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
          VITE_VOICE_AGENT_URL: ${{ secrets.NEXT_PUBLIC_VOICE_AGENT_URL }}

      - name: Upload artifact (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: clarte-desktop-macos
          path: apps/desktop/src-tauri/target/release/bundle/

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: clarte-desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/

  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: clarte-desktop-windows
          path: win-artifacts

      - name: Get version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./apps/desktop/src-tauri/tauri.conf.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Clarte Desktop v${{ steps.version.outputs.version }}
          draft: false
          files: win-artifacts/**/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
