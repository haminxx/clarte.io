name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - v0/clarte_main
concurrency:
  group: firebase-deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: true
      ACTIONS_RUNNER_DEBUG: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL || 'https://placeholder.livekit.cloud' }}
          NEXT_PUBLIC_VOICE_AGENT_URL: ${{ secrets.NEXT_PUBLIC_VOICE_AGENT_URL || 'https://placeholder.render.com' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyAElfJYllj4ZTl1n08Imz5f7DLakygKhVg' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'clarte-8aece.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'clarte-8aece' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'clarte-8aece.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '698398127871' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:698398127871:web:6de36f026d1f7a9b01feca' }}

      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "::error::Build failed: out/ directory not found. Check Build step logs."
            exit 1
          fi
          echo "Build output verified: $(ls out | head -5)"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SA_CLARTE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLARTE_8AECE }}
          FIREBASE_SA_GENERIC: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SA_CLARTE" ]; then
            printf '%s' "$FIREBASE_SA_CLARTE" > "${RUNNER_TEMP}/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-sa.json"
          elif [ -n "$FIREBASE_SA_GENERIC" ]; then
            printf '%s' "$FIREBASE_SA_GENERIC" > "${RUNNER_TEMP}/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-sa.json"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            export FIREBASE_TOKEN
          else
            echo "::error::No Firebase deploy credentials. Add FIREBASE_SERVICE_ACCOUNT_CLARTE_8AECE (service account JSON) in GitHub repo Settings → Secrets → Actions."
            exit 1
          fi
          npx firebase-tools@13.0.0 deploy --only hosting --project clarte-8aece --non-interactive --force
