name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - v0/clarte_main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Added env here so Next.js can see the Render URL during build
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_PIPECAT_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_PIPECAT_BACKEND_URL }}
          
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLARTE_73F7D }}
          channelId: live
          projectId: clarte-73f7d