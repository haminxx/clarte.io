<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarte</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      min-height: 200px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a14;
      color: white;
      padding: 20px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
      background: linear-gradient(to right, #60a5fa, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.5;
      margin-bottom: 16px;
    }
    a {
      color: #60a5fa;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .btn {
      display: inline-block;
      padding: 10px 16px;
      background: linear-gradient(to right, #3b82f6, #6366f1);
      color: white;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-align: center;
      margin-top: 8px;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1>Clarte</h1>
  <p>Voice AI that runs at the speed of thought. Quick access to your AI assistant from any tab.</p>
  <a href="https://clarte.io" target="_blank" class="btn">Open Clarte</a>
</body>
</html>
