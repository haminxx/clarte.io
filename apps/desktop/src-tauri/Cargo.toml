[package]
name = "clarte-desktop"
version = "0.1.0"
description = "Clarte voice AI desktop app"
edition = "2021"
license = "MIT"

[lib]
name = "clarte_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
